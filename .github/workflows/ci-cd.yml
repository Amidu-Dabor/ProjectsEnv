name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    env:
      DOCKERFILES: '{"api_gateway": "api_gateway/Dockerfile", "auth_service": "services/auth_service/Dockerfile", "general_chat_service": "services/general_chat_service/Dockerfile", "study_support_service": "services/study_support_service/Dockerfile", "data_service": "services/data_service/Dockerfile", "response_service": "services/response_service/Dockerfile", "system_prompt_service": "services/system_prompt_service/Dockerfile", "training_service": "services/training_service/Dockerfile", "ui": "ui/Dockerfile"}'
      IMAGES: '{"api_gateway": "amidu/chatbot_prototype_api_gateway:latest", "auth_service": "amidu/chatbot_prototype_auth_service:latest", "general_chat_service": "amidu/chatbot_prototype_general_chat_service:latest", "study_support_service": "amidu/chatbot_prototype_study_support_service:latest", "data_service": "amidu/chatbot_prototype_data_service:latest", "response_service": "amidu/chatbot_prototype_response_service:latest", "system_prompt_service": "amidu/chatbot_prototype_system_prompt_service:latest", "training_service": "amidu/chatbot_prototype_training_service:latest", "ui": "amidu/chatbot_prototype_ui:latest"}'
    strategy:
      matrix:
        service: [ "api_gateway", "auth_service", "general_chat_service", "study_support_service", "data_service", "response_service", "system_prompt_service", "training_service", "ui" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ${{ fromJson(env.DOCKERFILES)[matrix.service] }}
          push: true
          tags: ${{ fromJson(env.IMAGES)[matrix.service] }}

  test-services:
    name: Test Docker Services Locally
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify Docker Compose installation
        run: docker compose version

      - name: Spin up services with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting 30 seconds for services to initialize..."
          sleep 30
          # Perform a health check on API Gateway (assuming host port 5008 is mapped in your docker-compose.yml)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5008)
          echo "API Gateway status code: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed. Dumping logs:"
            docker compose logs
            exit 1
          fi
          echo "Services are healthy."

      - name: Tear down services
        if: always()
        run: docker compose down

  deploy-modal:
    name: Deploy to Modal for Inferencing
    runs-on: ubuntu-latest
    needs: test-services
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Modal CLI and dependencies
        run: pip install modal

      - name: Deploy to Modal
        env:
          MODAL_API_KEY: ${{ secrets.MODAL_API_KEY }}
        run: python modal_deploy.py
